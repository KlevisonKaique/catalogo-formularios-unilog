<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#494a56">
  <title>Diagnóstico do Catálogo | Unilog Express</title>

  <style>
    :root {
      --cinza: #494a56;
      --vermelho: #db0812;
      --fundo: #f6f7f9;
      --borda: #dde1e6;
      --ok: #137333;
      --aviso: #9a6700;
      --erro: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--fundo);
      color: var(--cinza);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
    }

    .box {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.15;
    }

    .subtitulo {
      margin: 0 0 18px;
      color: #747681;
      font-size: 15px;
      line-height: 1.45;
    }

    .linha {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid #eeeeef;
      word-break: break-word;
      font-size: 15px;
      line-height: 1.45;
    }

    .linha:last-child { border-bottom: 0; }

    .selo {
      flex-shrink: 0;
      min-width: 74px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .selo.ok { background: #eaf4ec; color: var(--ok); }
    .selo.aviso { background: #fdf3dc; color: var(--aviso); }
    .selo.erro { background: #fcebea; color: var(--erro); }
    .selo.info { background: #eef0f3; color: var(--cinza); }

    .resultado-final {
      margin-top: 18px;
      padding: 15px 16px;
      border-radius: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .resultado-final.ok { background: #eaf4ec; color: var(--ok); }
    .resultado-final.aviso { background: #fdf3dc; color: var(--aviso); }
    .resultado-final.erro { background: #fcebea; color: var(--erro); }

    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 14px;
    }

    .botao {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid var(--cinza);
      border-radius: 10px;
      background: #fff;
      color: var(--cinza);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .botao.principal {
      border-color: var(--vermelho);
      background: var(--vermelho);
      color: #fff;
    }

    .botao:focus-visible, summary:focus-visible {
      outline: 3px solid var(--cinza);
      outline-offset: 2px;
    }

    .botao[disabled] { opacity: 0.6; cursor: wait; }

    .nota {
      margin: 14px 0 0;
      color: #747681;
      font-size: 13px;
      line-height: 1.45;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 14px; }
    td { padding: 4px 0; }
    td:last-child { text-align: right; font-weight: 700; }

    details { margin-top: 18px; }
    summary { cursor: pointer; font-weight: 700; }

    pre {
      margin: 12px 0 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.4;
      overflow: auto;
    }
  </style>
</head>

<body>
  <main class="box">
    <h1>Diagnóstico do Catálogo</h1>
    <p class="subtitulo">
      Verifica o forms.json publicado, a planilha em tempo real e a integridade dos registros.
    </p>

    <div class="acoes">
      <button type="button" id="repetir" class="botao principal">Repetir diagnóstico</button>
      <a class="botao" href="https://github.com/srcarneiro1/catalogo-formularios-unilog/actions/workflows/sync-catalog.yml" target="_blank" rel="noopener noreferrer">Gerenciar automações</a>
      <a class="botao" href="./">Voltar ao catálogo</a>
    </div>

    <div id="status" aria-live="polite"></div>
    <div id="final"></div>
    <div id="detalhes"></div>

    <p class="nota">
      “Gerenciar automações” abre a página do workflow no GitHub. Ativar ou executar a sincronização
      exige uma conta com permissão no repositório.
    </p>
  </main>

  <script src="config.js?v=20261123-1"></script>
  <script src="catalogo-core.js?v=20261123-1"></script>
  <script>
    (function () {
      "use strict";

      var Core = window.CatalogoCore;
      var CONFIG = window.CONFIG || {};
      var statusEl = document.getElementById("status");
      var finalEl = document.getElementById("final");
      var detalhesEl = document.getElementById("detalhes");
      var botao = document.getElementById("repetir");
      var cont;

      var ROTULOS = { ok: "OK", aviso: "ATENÇÃO", erro: "ERRO", info: "INFO" };

      function registrar(nivel, texto, extraNode) {
        if (nivel === "erro") cont.erros++;
        if (nivel === "aviso") cont.avisos++;
        var linha = document.createElement("div");
        linha.className = "linha";
        var selo = document.createElement("span");
        selo.className = "selo " + nivel;
        selo.textContent = ROTULOS[nivel];
        var corpo = document.createElement("div");
        corpo.textContent = texto;
        if (extraNode) corpo.appendChild(extraNode);
        linha.appendChild(selo);
        linha.appendChild(corpo);
        statusEl.appendChild(linha);
      }

      function requisitar(url, timeoutMs) {
        return new Promise(function (resolve) {
          var xhr = new XMLHttpRequest();
          var inicio = Date.now();
          xhr.open("GET", url + (url.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now(), true);
          xhr.timeout = timeoutMs;
          xhr.onload = function () {
            var r = { status: xhr.status, ms: Date.now() - inicio, texto: xhr.responseText };
            if (xhr.status < 200 || xhr.status >= 300) { r.erro = "HTTP " + xhr.status; resolve(r); return; }
            try { r.dados = JSON.parse(xhr.responseText); }
            catch (e) { r.erro = "resposta não é JSON válido"; }
            resolve(r);
          };
          xhr.onerror = function () { resolve({ erro: "falha de rede ou bloqueio do navegador (CORS)" }); };
          xhr.ontimeout = function () { resolve({ erro: "tempo limite de " + (timeoutMs / 1000) + " s" }); };
          xhr.send();
        });
      }

      function tabelaCategorias(porCategoria) {
        var t = document.createElement("table");
        Object.keys(porCategoria).sort(function (a, b) { return a.localeCompare(b, "pt-BR"); })
          .forEach(function (c) {
            var tr = t.insertRow();
            tr.insertCell().textContent = c;
            tr.insertCell().textContent = porCategoria[c];
          });
        return t;
      }

      function auditarERegistrar(dados) {
        var a = Core.auditar(dados);
        registrar("ok", "Estrutura válida: " + a.total + " registro(s), " + a.ativos + " ativo(s), " + a.inativos + " inativo(s).");

        if (a.ativos === 0) registrar("aviso", "Nenhum formulário ativo: o catálogo aparecerá vazio.");

        registrar(a.idsDuplicados.length ? "erro" : "ok",
          a.idsDuplicados.length ? "IDs duplicados: " + a.idsDuplicados.join(", ") + "." : "Nenhum ID duplicado.");

        registrar(a.incompletos.length ? "erro" : "ok",
          a.incompletos.length
            ? "Registros incompletos: " + a.incompletos.map(function (i) { return i.rotulo + " (falta " + i.faltando.join(", ") + ")"; }).join("; ") + "."
            : "Todos os registros têm id, nome, categoria e URL.");

        registrar(a.urlsInvalidas.length ? "erro" : "ok",
          a.urlsInvalidas.length ? "URLs malformadas: " + a.urlsInvalidas.join(", ") + "." : "Todas as URLs são bem formadas.");

        registrar(a.linksDeEdicao.length ? "aviso" : "ok",
          a.linksDeEdicao.length
            ? "Link de edição em vez de link de resposta: " + a.linksDeEdicao.join(", ") + ". Quem não for editor do formulário verá pedido de acesso."
            : "Nenhum link de edição do Google Forms.");

        registrar("info", "Formulários ativos por categoria:", tabelaCategorias(a.porCategoria));
        return a;
      }

      function assinatura(lista) {
        return JSON.stringify(Core.ordenar(Core.ativos(lista || [])).map(function (f) {
          return [f.id, f.nome, f.categoria, f.url];
        }));
      }

      function finalizar() {
        var div = document.createElement("div");
        if (cont.erros) {
          div.className = "resultado-final erro";
          div.textContent = "CATÁLOGO COM FALHA: " + cont.erros + " erro(s) e " + cont.avisos + " aviso(s).";
        } else if (cont.avisos) {
          div.className = "resultado-final aviso";
          div.textContent = "CATÁLOGO APTO COM RESSALVAS: " + cont.avisos + " aviso(s) para revisão.";
        } else {
          div.className = "resultado-final ok";
          div.textContent = "CATÁLOGO APTO: todas as verificações passaram.";
        }
        finalEl.innerHTML = "";
        finalEl.appendChild(div);
        botao.disabled = false;
        botao.textContent = "Repetir diagnóstico";
      }

      function executar() {
        cont = { erros: 0, avisos: 0 };
        statusEl.innerHTML = "";
        finalEl.innerHTML = "";
        detalhesEl.innerHTML = "";
        botao.disabled = true;
        botao.textContent = "Verificando...";

        if (!Core) {
          registrar("erro", "catalogo-core.js não carregou. O catálogo também não funcionará.");
          finalizar();
          return;
        }
        registrar("ok", "Scripts da página carregados.");

        var temPlanilha = Core.urlValida(CONFIG.API_URL);

        Promise.all([
          requisitar("forms.json", 12000),
          temPlanilha ? requisitar(CONFIG.API_URL, 10000) : Promise.resolve(null)
        ]).then(function (res) {
          var local = res[0], planilha = res[1];
          var localOk = !local.erro && Array.isArray(local.dados);
          var planilhaOk = planilha && !planilha.erro && Array.isArray(planilha.dados) &&
            Core.ativos(planilha.dados).length > 0;

          /* 1. Situação de cada fonte (só conexão, sem repetir a auditoria) */
          registrar("info", "Fontes de dados");

          if (local.erro) {
            registrar("erro", "forms.json (cópia de segurança) indisponível: " + local.erro + ".");
          } else if (!Array.isArray(local.dados)) {
            registrar("erro", "forms.json não contém uma lista.");
          } else {
            registrar("ok", "forms.json (cópia de segurança) carregado em " + local.ms + " ms.");
          }

          if (!temPlanilha) {
            registrar("aviso", "Endereço da planilha não configurado em config.js. O catálogo usa só o forms.json.");
          } else if (planilha.erro) {
            registrar("aviso", "Planilha não respondeu neste navegador (" + planilha.erro + "). O catálogo está usando o forms.json.");
          } else if (!planilhaOk) {
            registrar("aviso", "A planilha respondeu sem formulários ativos válidos. O catálogo está usando o forms.json.");
          } else {
            registrar("ok", "Planilha respondeu em " + planilha.ms + " ms.");
          }

          if (planilhaOk && localOk) {
            if (assinatura(local.dados) === assinatura(planilha.dados)) {
              registrar("ok", "forms.json está sincronizado com a planilha.");
            } else {
              registrar("aviso", "forms.json difere da planilha. O catálogo mostra a planilha; a cópia será atualizada na próxima execução do GitHub Actions.");
            }
          }

          /* 2. Auditoria uma única vez, dos dados que o catálogo exibe */
          var dados = planilhaOk ? planilha.dados : (localOk ? local.dados : null);

          if (dados) {
            registrar("info", "Registros exibidos no catálogo (fonte: " + (planilhaOk ? "planilha" : "forms.json") + ")");
            auditarERegistrar(dados);
          }

          registrar("info", "Disponibilidade dos links externos não é testada aqui: o Google Forms bloqueia esse tipo de verificação pelo navegador (CORS). Um bloqueio não significa que o formulário esteja fora do ar.");

          if (dados) {
            var details = document.createElement("details");
            var summary = document.createElement("summary");
            var pre = document.createElement("pre");
            summary.textContent = "Ver dados exibidos no catálogo";
            pre.textContent = JSON.stringify(dados, null, 2);
            details.appendChild(summary);
            details.appendChild(pre);
            detalhesEl.appendChild(details);
          }

          finalizar();
        });
      }

      botao.addEventListener("click", executar);
      executar();
    })();
  </script>
</body>
</html>
